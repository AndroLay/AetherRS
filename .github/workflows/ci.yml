name: CI

on:
  push:
  pull_request:

jobs:
  check-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (GNU toolchain)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Check PowerShell script syntax
        shell: pwsh
        run: |
          foreach ($f in @('deploy-win12-rust.ps1', 'uninstall-win12-rust.ps1', 'win12-files-assoc.ps1', 'catat-pemakaian.ps1', 'pack-release.ps1')) {
            $err = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f, [ref]$null, [ref]$err)
            if ($err.Count -gt 0) {
              $err | ForEach-Object { Write-Error "$f`: $_" }
              exit 1
            }
          }

      - name: Cargo check (lib + bins)
        run: cargo check --lib --bins --target x86_64-pc-windows-gnu

      - name: Cargo test
        run: cargo test --target x86_64-pc-windows-gnu
