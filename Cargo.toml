[package]
name = "w12"
version = "0.1.0"
edition = "2021"
publish = false
description = "Port Rust dari Win12 Shell (sumber C++/C di ..\\win12-shell)"

[dependencies]
windows = { version = "0.61", features = [
    "ApplicationModel",
    "Devices_Radios",
    "UI",
    "UI_Notifications",
    "UI_Notifications_Management",
    "Foundation",
    "Foundation_Collections",
    "Foundation_Numerics",
    "Media_Control",
    "Storage_Streams",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Display",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_Properties",
    "Win32_Graphics_Dxgi_Common",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Networking_NetworkListManager",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Kernel",
    "Win32_System_ProcessStatus",
    "Win32_System_RemoteDesktop",
    "Win32_System_Shutdown",
    "Win32_System_StationsAndDesktops",
    "Win32_System_TaskScheduler",
    "Win32_System_Time",
    "Win32_System_WindowsProgramming",
    "Win32_System_Wmi",
    "Win32_UI_Accessibility",
    "Win32_UI_Input",
    "Win32_UI_Magnification",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_WiFi",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.61"
# Tipe Vector2/Matrix3x2 untuk API D2D (versi sama dengan dependensi crate windows 0.61.3).
windows-numerics = "0.2"

[profile.release]
# Profil ramping (terinspirasi WinRust): pangkas simbol & kode mati lintas-binary tanpa mematikan unwind.
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
